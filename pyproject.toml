[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stock-analysis-agent"
version = "0.1.0"
description = "Research assistant for structural equity analysis (KR + US markets)"
requires-python = ">=3.11"
dependencies = [
    # LLM
    "anthropic>=0.40.0",
    # Data validation & config
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    # US market data
    "yfinance>=0.2.40",
    "httpx>=0.27.0",
    # Korean market data
    "finance-datareader>=0.9.0",
    "pykrx>=1.0.45",
    "requests>=2.31.0",
    # Numerical / data processing
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "ta>=0.11.0",
    # Report rendering
    "jinja2>=3.1.4",
    "markdown>=3.6",
    # CLI
    "typer>=0.12.0",
    "rich>=13.7.0",
    # API server
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "responses>=0.25.0",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
    "pandas-stubs>=2.2.0",
    "types-requests>=2.31.0",
]

[project.scripts]
stock-analyze = "apps.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["apps", "config", "services", "pipelines", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: pure unit tests, no I/O",
    "integration: uses fixture data, no live APIs",
    "e2e: full pipeline with mocked external services",
    "live: calls real APIs, skipped in CI",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["services", "config", "pipelines"]
omit = ["tests/*", "**/stub.py"]
